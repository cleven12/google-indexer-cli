name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Offline CLI smoke test
        run: |
          bun src/cli.ts --version
          bun src/cli.ts --profile demo --sitemap fixtures/sample_sitemap.xml --list-only --limit 20
          bun src/cli.ts --profile demo --sitemap fixtures/sample_sitemap.xml --type tours --export-queue tours_q.txt
          test -s tours_q.txt
