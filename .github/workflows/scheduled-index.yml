name: Scheduled Indexing

# Runs the bulk indexer on a schedule against one site (edit SITE/SITEMAP/SITE_URL
# below), persisting submission history by committing history/<name>.json back to
# this repo after each run (Actions runners are ephemeral - nothing survives a run
# unless it's written back somewhere durable).
#
# Setup: add a GOOGLE_SERVICE_ACCOUNT_JSON repo secret with the full contents of your
# service_account.json (see docs/GSC_SETUP.md), then edit the env: block below.
# See README.md's "Scheduled Indexing" section for full setup steps.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

env:
  SITE: https://kilitasafaris.com
  SITEMAP: https://kilitasafaris.com/sitemap.xml
  SITE_URL: sc-domain:kilitasafaris.com
  HISTORY_FILE: history/kilita.json
  LIMIT: 150
  COOLDOWN_HOURS: 24

permissions:
  contents: write

concurrency:
  group: scheduled-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Write service account credentials
        run: |
          mkdir -p /tmp/gsc
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/gsc/service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run bulk submission
        run: |
          mkdir -p "$(dirname "$HISTORY_FILE")"
          google-indexer \
            --site "$SITE" \
            --sitemap "$SITEMAP" \
            --site-url "$SITE_URL" \
            --service-account /tmp/gsc/service_account.json \
            --submit \
            --resume \
            --cooldown-hours "$COOLDOWN_HOURS" \
            --limit "$LIMIT" \
            --history-backend json \
            --db-path "$HISTORY_FILE"

      - name: Remove service account credentials
        if: always()
        run: rm -rf /tmp/gsc

      - name: Commit updated history
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- "$HISTORY_FILE")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$HISTORY_FILE"
            git commit -m "Update indexing history ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No history changes to commit."
          fi
