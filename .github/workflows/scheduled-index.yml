name: Scheduled Indexing

# Submits a slice of the sitemap once a day. Configure via repository settings:
#   secret   GOOGLE_SERVICE_ACCOUNT_JSON  full contents of the service account key
#   variable SITE, SITEMAP, SITE_URL      (optional: LIMIT, COOLDOWN_HOURS)
# The history database is kept in the Actions cache between runs.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scheduled-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    env:
      HISTORY_DB: history/indexer.db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Restore history
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HISTORY_DB }}*
          key: index-history-${{ github.run_id }}
          restore-keys: index-history-

      - name: Submit
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/key.json"
          mkdir -p history
          bun src/cli.ts \
            --site "${{ vars.SITE }}" \
            --sitemap "${{ vars.SITEMAP }}" \
            --site-url "${{ vars.SITE_URL }}" \
            --service-account "$RUNNER_TEMP/key.json" \
            --submit --resume \
            --cooldown-hours "${{ vars.COOLDOWN_HOURS || 24 }}" \
            --limit "${{ vars.LIMIT || 150 }}" \
            --db-path "$HISTORY_DB"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json"

      - name: Save history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HISTORY_DB }}*
          key: index-history-${{ github.run_id }}
